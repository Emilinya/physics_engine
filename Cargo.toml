[package]
name = "physics_engine"
version = "0.1.0"
edition = "2024"

[lints.clippy]
use_self = "warn"
semicolon_if_nothing_returned = "warn"
or_fun_call = "warn"
unused_async = "warn"
needless_pass_by_ref_mut = "warn"

[dependencies]
bevy = { version = "0.16.1" }
clap = { version = "4.5.41", features = ["derive"] }
strum = { version = "0.27.2", features = ["derive"] }
nalgebra = "0.33.2"
rand = "0.9.2"
getrandom = { version = "0.3.3", features = ["wasm_js"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[features]
default = ["dynamic_linking"]
dynamic_linking = ["bevy/dynamic_linking"]
